.idm-menu-btn{width:48px;height:48px;border:0!important;background:transparent!important;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:none!important}
.idm-brand-title{margin-left:12px;color:#fff;line-height:1.08}

.idm-top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}

.idm-top-actions .btn-refresh{background-color:#005baa!important;color:#fff!important}
.idm-top-actions .btn-export{background-color:#ffd100!important;color:#fff!important}

.idm-top-actions .btn-export:hover{background-color:#e6bc00!important}

.idm-nav button:hover{color:var(--idm-red)!important}
.idm-nav button.idm-active{color:var(--idm-red)!important}

.idm-content{max-width:none;width:100%;margin:0;padding:7px 10px 10px}
.idm-period{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#6b7280;font-size:12px}
.idm-period strong{color:#1f2937;font-size:13px}
.idm-period-selector{display:flex;align-items:center;justify-content:flex-start;gap:5px;min-width:150px}
.idm-period-selector select{appearance:none;background:transparent;border:0;outline:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;padding:2px 18px 2px 2px;text-align:left}
.idm-period-selector select option{color:#1f2937;background:#fff}
.idm-period-selector select:disabled{opacity:.7;cursor:wait}

/* ===== REKAP PRESENSI ===== */
/* Outer containers are transparent; borders belong to the table/grid. */
.rekap-card,
.rekap-container,
.rekap-wrapper,
.rekap-panel {
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  background: transparent !important;
}
.rekap-card > .rekap-table,
.rekap-container > .rekap-table,
.rekap-wrapper > .rekap-table,
.rekap-panel > .rekap-table {
  border-collapse: collapse;
}

.rekap-table {
  width: max-content !important;
  min-width: 0 !important;
  font-size: 10px !important;
  border-collapse: collapse !important;
  table-layout: fixed !important;
  border: 1px solid #cbd5e1 !important;
}
.rekap-table th,
.rekap-table td {
  border: 1px solid #cbd5e1;
  white-space: nowrap !important;
  box-sizing: border-box !important;
}
.rekap-table th,
.rekap-table thead th {
  text-align: center !important;
  vertical-align: middle !important;
  font-size: 10px !important;
  font-weight: 600 !important;
  padding: 2px 1px !important;
  line-height: 1.15 !important;
}
.rekap-table td {
  font-size: 10px !important;
  font-weight: 400 !important;
  vertical-align: middle !important;
  padding: 0 !important;
  line-height: var(--rekap-row-h, 16px) !important;
  height: var(--rekap-row-h, 16px) !important;
  min-height: 0 !important;
}
.rekap-table tbody tr,
.rekap-table tbody td {
  height: var(--rekap-row-h, 16px) !important;
  min-height: 0 !important;
}
.rekap-table tbody td { max-height: none !important; }

.rekap-table .nama-cell,
.rekap-table .nik-cell,
.rekap-table .bagian-cell {
  box-sizing: border-box !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  white-space: nowrap !important;
}
.rekap-table .nama-cell {
  width: 180px !important;
  min-width: 180px !important;
  max-width: 180px !important;
  padding: 0 8px !important;
}
.rekap-table .nik-cell {
  width: 100px !important;
  min-width: 100px !important;
  max-width: 100px !important;
}
.rekap-table .bagian-cell {
  width: 100px !important;
  min-width: 100px !important;
  max-width: 100px !important;
}
.rekap-table .col-no {
  width: 20px !important;
  min-width: 20px !important;
  max-width: 20px !important;
}
.rekap-table .col-nama {
  width: 180px !important;
  min-width: 180px !important;
  max-width: 180px !important;
}
.rekap-table .col-nik {
  width: 100px !important;
  min-width: 100px !important;
  max-width: 100px !important;
}
.rekap-table .col-bagian {
  width: 100px !important;
  min-width: 100px !important;
  max-width: 100px !important;
}
.rekap-table .col-tanggal,
.rekap-table .col-ringkasan,
.rekap-table .status-cell,
.rekap-table .tanggal-cell,
.rekap-table td[class*="sum-"],
.rekap-table th[class*="sum-"] {
  width: 30px !important;
  min-width: 30px !important;
  max-width: 30px !important;
}

.rekap-table .kode-text {
  display: inline;
  font-weight: 400;
  font-size: 10px;
  line-height: 1;
}
.rekap-table .status-cell {
  padding: 0 !important;
  height: var(--rekap-row-h, 16px) !important;
  min-height: 0 !important;
  line-height: var(--rekap-row-h, 16px) !important;
  text-align: center;
  vertical-align: middle;
  font-weight: 400;
}
.rekap-table .status-cell.status-blank,
.rekap-table .status-cell.status-OK {
  background: #fff !important;
  color: #111827;
}
.rekap-table .status-cell.status-DT { background: #facc15 !important; color: #a16207 !important; }
.rekap-table .status-cell.status-OFF { background: #ffd9d9 !important; color: #ef1111 !important; }
.rekap-table .status-cell.status-S { background: #ffedd5 !important; color: #c2410c !important; }
.rekap-table .status-cell.status-C { background: #dcfce7 !important; color: #16a34a !important; }
.rekap-table .status-cell.status-LAM,
.rekap-table .status-cell.status-LAP { background: #ffe4e6 !important; color: #dc2626 !important; }
.rekap-table .status-cell.status-IDT,
.rekap-table .status-cell.status-DL,
.rekap-table .status-cell.status-IP { background: #cffafe !important; color: #0891b2 !important; }
.rekap-table .status-cell.status-TSM { background: #e9d5ff !important; color: #581c87 !important; }
.rekap-table .status-cell.status-M { background: #dc2626 !important; color: #fff !important; }
.rekap-table .status-cell .kode-text { color: inherit !important; }
.rekap-table .status-cell.status-TSM .kode-text { color: #581c87 !important; }
.rekap-table .status-cell.status-M .kode-text { color: #fff !important; }

/* Summary cells stay neutral; Tot.Pel keeps its value-based background. */
.rekap-table td[class*="sum-"] {
  padding: 0 !important;
  line-height: var(--rekap-row-h, 16px) !important;
  height: var(--rekap-row-h, 16px) !important;
  background: #fff !important;
  color: #111827 !important;
  font-weight: 400 !important;
}
.rekap-table td.sum-Pel.totpel-cell {
  background: var(--totpel-bg, #ecfdf5) !important;
  color: #111827 !important;
  font-weight: 400 !important;
}
.rekap-table tbody tr:hover td:not(.status-cell) { background: #f8fafc !important; }
.rekap-table-wrap {
  width: 100%;
  overflow-x: auto;
  overflow-y: visible;
  display: flex;
  justify-content: center;
  --rekap-row-h: clamp(10px, calc((100vh - 190px) / max(1, var(--rekap-row-count))), 24px);
}
.rekap-table-wrap table { min-width: max-content; }
.rekap-legend {
  text-align: center !important;
  font-size: 10px !important;
  justify-content: center !important;
  width: 100%;
}

/* ===== RINCIAN PELANGGARAN ===== */
.pelanggaran-table th,
.pelanggaran-table td {
  font-size: 13px !important;
  line-height: 18px !important;
  vertical-align: middle !important;
  box-sizing: border-box;
}
.pelanggaran-table tbody td { height: 28px; }
.pelanggaran-table thead th { height: 34px; line-height: 16px !important; }
.pelanggaran-table input {
  font-size: 13px !important;
  line-height: 16px !important;
  vertical-align: middle;
}


/* ===== DETAIL KARYAWAN ===== */
.detail-karyawan-layout { width: 100%; }
.detail-karyawan-list { width: 256px; transition: width .18s ease; }
.detail-karyawan-list.detail-list-collapsed { width: 40px; }
.detail-karyawan-list { min-height: 0; }
.detail-karyawan-list button {
  min-height: var(--detail-row-h, 22px);
  line-height: 1.1 !important;
}
.detail-karyawan-list .text-\[10px\] { font-size: 10px !important; }
.detail-harian-table { font-size: 10px !important; }
.detail-harian-table th,
.detail-harian-table td {
  font-size: 10px !important;
  line-height: 1.05 !important;
  height: var(--detail-row-h, 20px);
  padding-top: 2px !important;
  padding-bottom: 2px !important;
}
.detail-harian-table thead th { height: 30px; }

@media (max-height: 700px) {
  .detail-karyawan-layout { height: calc(100vh - 135px) !important; }
  .detail-harian-table th,
  .detail-harian-table td { font-size: 9px !important; }
}
@media (max-width: 900px) {
  .detail-karyawan-list { width: 190px; }
  .detail-karyawan-list.detail-list-collapsed { width: 22px; }
  .detail-header-row { flex-wrap: wrap; row-gap: 2px; margin-bottom: 8px !important; }
  .detail-header-row h2 { font-size: 13px !important; }
  .detail-stat-grid { grid-template-columns: repeat(3, minmax(0,1fr)) !important; gap: 5px !important; margin-bottom: 8px !important; }
  .detail-stat-grid > div { padding: 4px 3px !important; }
  .detail-stat-grid .text-\[11px\] { font-size: 8px !important; }
  .detail-stat-grid .text-lg { font-size: 12px !important; }
  .detail-stat-grid .text-\[10px\] { font-size: 7px !important; }
}

/* One consolidated mobile breakpoint. Values below are the effective values
   from the previous duplicate rules; conflicting declarations are removed. */
@media (max-width: 900px) {
  .idm-brandbar { min-height: 40px !important; padding: 6px 8px !important; }
  .idm-logo { width: 74px; height: 26px; border-width: 2px; }
  .idm-logo:before { font-size: 8px; padding: 1px 5px; border-width: 1px; }
  .idm-brand-title { margin-left: 6px; }
  .idm-brand-title h1 { font-size: 11px; }
  .idm-brand-title p { font-size: 7px; }
  .idm-menu-btn { width: 32px !important; height: 32px !important; }
  .idm-menu-btn svg { width: 18px !important; height: 18px !important; }
  .idm-nav { height: 28px; overflow-x: auto; padding: 0 8px; }
  .idm-nav button { height: 28px; padding: 0 8px !important; font-size: 7px !important; }
  .idm-top-actions { gap: 3px; }
  .idm-top-actions button { padding: 4px 6px !important; font-size: 8px !important; gap: 3px !important; }
  .idm-top-actions svg { width: 12px !important; height: 12px !important; }
  .idm-btn-sub { display: none; }
  .idm-top-actions button[aria-label="Menu admin"] svg,
  .idm-top-actions button[aria-label="Kembali ke halaman utama"] svg { width: 18px !important; height: 18px !important; }
  .rekap-table-wrap { justify-content: flex-start !important; }
}

/* common UI */
.rounded-lg,.rounded-2xl{box-shadow:0 2px 8px rgba(31,41,55,.06)}
.border-slate-200,.border-slate-300{border-color:#d7dee7!important}
button.text-white{background-color:var(--idm-red)!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#edf1f5}::-webkit-scrollbar-thumb{background:#9da9b6;border-radius:8px}

</style>

const LATE_THRESHOLD_MIN = 6 * 60; // fallback jika kode shift tidak dikenali — 06:00

/* Tabel referensi kode shift (reguler + khusus Jumat). Kode Jumat sudah unik   */
/* (mis. 1510, 160, 91603, dst) sehingga cukup satu tabel gabungan — kode yang  */
/* tercatat di file presensi otomatis menunjukkan jadwal mana yang berlaku.    */
function toMinutes(hhmm) {
  const parts = (hhmm || '').split(':').map((x) => parseInt(x, 10));
  if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  return parts[0] * 60 + parts[1];
}

// Normalisasi jam ke format yang dipakai database/rule presensi: h:mm (tanpa 0 di depan).
// Input type=time memang mengembalikan HH:MM, jadi saat disimpan kita ubah kembali ke h:mm.
function normalizeShiftTime(value) {
  const m = String(value || '').trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return String(value || '').trim();
  return `${parseInt(m[1], 10)}:${m[2]}`;
}

function normalizeShiftTable(table) {
  const out = {};
  Object.entries(table || {}).forEach(([k, v]) => {
    if (!v || typeof v !== 'object') return;
    out[k] = {
      ...v,
      masuk: normalizeShiftTime(v.masuk),
      pulang: normalizeShiftTime(v.pulang),
    };
  });
  return out;
}

const SHIFT_TABLE = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem('lhpk-shift-table') || 'null');
    if (saved && typeof saved === 'object') return normalizeShiftTable({ ...DEFAULT_SHIFT_TABLE, ...saved });
  } catch (e) {}
  return normalizeShiftTable(DEFAULT_SHIFT_TABLE);
})();

function shiftInfoFor(shiftCode) {
  const key = (shiftCode || '').toString().trim();
  return key && SHIFT_TABLE[key] ? SHIFT_TABLE[key] : null;
}

function getUnexplainedViolationRows(data) {
  const out = [];
  data.employees.forEach((emp) => {
    for (let d = 1; d <= data.monthLength; d++) {
      const rec = emp.days[d];
      if (!rec || !PELANGGARAN_CODES.includes(rec.code) || rec.sudahDijelaskan) continue;
      const info = shiftInfoFor(rec.shift);
      const wkFull = data.year && data.monthNum ? WEEKDAY_FULL_ID[new Date(data.year, data.monthNum - 1, d).getDay()] : '';
      out.push({
        ...rec,
        nik: emp.nik,
        nama: emp.nama,
        bagian: emp.bagian || '',
        day: d,
        tanggalLabel: data.year && data.monthNum
          ? `${wkFull}, ${String(d).padStart(2, '0')} ${MONTH_ID[Object.keys(MONTH_NUM).find((k) => MONTH_NUM[k] === data.monthNum)] || ''} ${data.year}`
          : String(d).padStart(2, '0'),
        masukSeharusnya: info?.masuk || '—',
        pulangSeharusnya: info?.pulang || '—',
        jenis: CODE_META[rec.code]?.label || rec.status || rec.code,
        keterangan:
          rec.code === 'M' ? 'Mangkir' :
          rec.code === 'LAM' ? 'Lupa Absen Masuk' :
          rec.code === 'LAP' ? 'Lupa Absen Pulang' :
          rec.code === 'TSM' ? 'Salah TSM' : (rec.status || rec.code),
      });
    }
  });
  out.sort((a, b) => a.day - b.day || a.nama.localeCompare(b.nama, 'id') || a.nik.localeCompare(b.nik));
  return out;
}

function deriveCode(status, masuk, shiftCode) {
  const s = (status || '').trim();
  if (s === 'Libur') return { code: 'OFF' };
  if (s === 'Sakit') return { code: 'S' };
  if (s === 'Cuti Tahunan' || s === 'Cuti Besar') return { code: 'C' };
  if (s === 'Mangkir') return { code: 'M' };
  if (s === 'Lupa Absen Waktu Masuk') return { code: 'LAM' };
  if (s === 'Lupa Absen Waktu Pulang') return { code: 'LAP' };
  if (s === 'Ijin Datang Terlambat') return { code: 'IDT' };
  if (s === 'Ijin Pulang') return { code: 'IP' };
  if (s === 'Dinas Luar Kota') return { code: 'DL' };
  if (s === 'Hadir') {
    const parts = (masuk || '').split(':').map((x) => parseInt(x, 10));
    if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
      const total = parts[0] * 60 + parts[1];
      const info = shiftInfoFor(shiftCode);
      const scheduled = info ? toMinutes(info.masuk) : LATE_THRESHOLD_MIN;
      // SALAH TSM:
      // - masuk aktual lebih dari 4 jam lebih awal dari jadwal, ATAU
      // - masuk aktual lebih dari 1 jam lebih lambat dari jadwal.
      const tsmEarlyLimit = scheduled - (4 * 60);
      const tsmLateLimit = scheduled + 60;
      if (total < tsmEarlyLimit || total > tsmLateLimit) {
        return { code: 'TSM' };
      }

      // Datang Terlambat ditampilkan langsung pada kolom tanggal.
      // Terlambat sampai dengan 1 jam = DT; lebih dari 1 jam = TSM.
      if (total > scheduled) {
        return { code: 'DT', lateMin: total - scheduled };
      }

      return { code: 'OK' };
    }
    return { code: 'OK' };
  }
  return { code: '-' };
}

function emptyTotals() {
  return { OK: 0, OFF: 0, S: 0, C: 0, M: 0, LAM: 0, LAP: 0, TSM: 0, IDT: 0, DL: 0, IP: 0, DT: 0, minutes: 0 };
}

/* ---------------------------------------------------------------------- */
/*  File parsing                                                           */
/* ---------------------------------------------------------------------- */

async function parseLhpkFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });

  // metadata (divisi, mgr, spv, periode, cabang) — best effort, never blocks parsing
  const meta = { divisi: '', mgr: '', spv: '', periode: '', cabang: '', perusahaan: '' };
  let brandRowsSeen = 0;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const r = rows[i];
    const c0 = (r[0] || '').toString().trim();
    if (c0 === 'Divisi') meta.divisi = (r[1] || '').toString().trim();
    else if (c0 === 'Mgr') meta.mgr = (r[1] || '').toString().trim();
    else if (c0 === 'Spv') meta.spv = (r[1] || '').toString().trim();
    else if (c0 === 'Periode Bulan') meta.periode = (r[1] || '').toString().trim();
    else if (c0.includes(' - ') && brandRowsSeen === 0) { meta.perusahaan = c0; brandRowsSeen = 1; }
    else if (c0.includes(' - ') && brandRowsSeen === 1) { meta.cabang = c0; brandRowsSeen = 2; }
  }

  const headerIdx = rows.findIndex((r) => (r[1] || '').toString().trim().toLowerCase() === 'nik');
  if (headerIdx === -1) {
    throw new Error('Format file tidak dikenali — kolom "Nik" tidak ditemukan. Pastikan ini file LHPK (Laporan History Presensi Karyawan) asli.');
  }

  let dataStart = -1;
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    const nikCandidate = (r[1] || '').toString().trim();
    const tglCandidate = (r[3] || '').toString().trim();
    if (/^\d{4,}$/.test(nikCandidate) && /\d{1,2}\s+\w+\s+\d{4}/.test(tglCandidate)) { dataStart = i; break; }
  }
  if (dataStart === -1) dataStart = headerIdx + 3;

  const employeesMap = new Map();
  let year = null, monthNum = null, monthName = '';

  for (let i = dataStart; i < rows.length; i++) {
    const r = rows[i];
    const nik = (r[1] || '').toString().trim();
    const nama = (r[2] || '').toString().trim();
    const tgl = (r[3] || '').toString().trim();
    const m = tgl.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
    if (!nik || !nama || !m) continue;

    const day = parseInt(m[1], 10);
    if (!year) { year = parseInt(m[3], 10); monthName = m[2]; monthNum = MONTH_NUM[m[2]] || null; }

    const shift = (r[4] || '').toString().trim();
    const status = (r[5] || '').toString().trim();
    const absid = (r[6] || '').toString().trim();
    const masuk = (r[7] || '').toString().trim();
    const pulang = (r[8] || '').toString().trim();
    const { code, lateMin } = deriveCode(status, masuk, shift);

    if (!employeesMap.has(nik)) employeesMap.set(nik, { nik, nama, days: {} });
    employeesMap.get(nik).days[day] = { shift, status, absid, masuk, pulang, code, lateMin: lateMin || 0 };
  }

  if (employeesMap.size === 0) {
    throw new Error('Tidak ada baris data karyawan yang bisa dibaca dari file ini.');
  }

  const monthLength = year && monthNum ? new Date(year, monthNum, 0).getDate() : 31;

  const employees = Array.from(employeesMap.values()).map((emp) => {
    const totals = emptyTotals();
    for (let d = 1; d <= monthLength; d++) {
      const rec = emp.days[d];
      if (!rec) continue;
      totals[rec.code] = (totals[rec.code] || 0) + 1;
      if (rec.code === 'DT') totals.minutes += rec.lateMin;
    }
    const pelanggaran = totals.DT + totals.LAM + totals.LAP + totals.M + totals.TSM;
    const avgMin = totals.DT > 0 ? Math.round(totals.minutes / totals.DT) : 0;
    return { ...emp, totals, pelanggaran, avgMin };
  });

  return {
    employees,
    monthLength,
    year,
    monthNum,
    monthLabelId: monthName ? `${MONTH_ID[monthName] || monthName} ${year}` : '',
    meta,
    parsedAt: Date.now(),
  };
}

function RekapTab({ data, onSelectEmployee, onSelectViolation }) {
  const days = Array.from({ length: data.monthLength }, (_, i) => i + 1);
  const weekdayFor = (d) => {
    if (!data.year || !data.monthNum) return '';
    return WEEKDAY_ID[new Date(data.year, data.monthNum - 1, d).getDay()];
  };

  const measureTextWidth = (text, font = '9px IBM Plex Sans') => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = font;
    return Math.ceil(ctx.measureText(String(text || '')).width) + 2;
  };
  const NO_W = 20;
  const NAMA_W = 180;
  const NIK_W = 100;
  const BAGIAN_W = 100;
  const NAMA_LEFT = NO_W, NIK_LEFT = NO_W + NAMA_W, BAGIAN_LEFT = NO_W + NAMA_W + NIK_W;

  // Sort bertingkat: total pelanggaran(z-a) -> avg(z-a) -> hadir(a-z) -> off(z-a) -> sakit(z-a) -> cuti(z-a) -> nama(a-z)
  const pelanggaranMax = useMemo(() => Math.max(0, ...data.employees.map(e => Number(e.pelanggaran) || 0)), [data.employees]);
  const pelanggaranColor = (value) => {
    const v = Number(value) || 0;
    if (!pelanggaranMax || v <= 0) return { '--totpel-bg': '#ecfdf5' };
    const t = Math.max(0, Math.min(1, v / pelanggaranMax));
    let c1, c2, u;
    if (t <= 0.5) {
      c1 = [236, 253, 245]; // hijau muda
      c2 = [254, 249, 195]; // kuning muda
      u = t / 0.5;
    } else {
      c1 = [254, 249, 195]; // kuning muda
      c2 = [254, 202, 202]; // merah muda
      u = (t - 0.5) / 0.5;
    }
    const rgb = c1.map((c, i) => Math.round(c + (c2[i] - c) * u));
    return { '--totpel-bg': `rgb(${rgb.join(', ')})` };
  };
  const sortedEmployees = useMemo(() => {
    const list = [...data.employees];
    list.sort((a, b) => (
      (b.pelanggaran - a.pelanggaran)
      || (b.avgMin - a.avgMin)
      || (a.totals.OK - b.totals.OK)
      || (b.totals.OFF - a.totals.OFF)
      || (b.totals.S - a.totals.S)
      || (b.totals.C - a.totals.C)
      || a.nama.localeCompare(b.nama, 'id')
    ));
    return list;
  }, [data.employees]);

  const downloadCsv = () => {
    const head = ['No', 'Nama', 'NIK', 'Bagian', ...days.map(String),
      'Hadir', 'Off', 'Sakit', 'Cuti', 'IDT', 'Total Pelanggaran', 'Lupa Absen Masuk', 'Lupa Absen Pulang', 'Mangkir', 'Datang Terlambat', 'Menit', 'AVG Menit'];
    const lines = [head.join(',')];
    sortedEmployees.forEach((emp, idx) => {
      const row = [
        idx + 1, `"${emp.nama}"`, emp.nik, `"${emp.bagian || ''}"`,
        ...days.map((d) => emp.days[d]?.code || '-'),
        emp.totals.OK, emp.totals.OFF, emp.totals.S, emp.totals.C, emp.totals.IDT,
        emp.pelanggaran, emp.totals.LAM, emp.totals.LAP, emp.totals.TSM, emp.totals.M, emp.totals.DT,
        emp.totals.minutes, emp.avgMin,
      ];
      lines.push(row.join(','));
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `rekap-presensi-${data.monthLabelId.replace(' ', '-').toLowerCase()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <div className="rekap-table-wrap" style={{'--rekap-row-count': sortedEmployees.length}}>
        <table className="rekap-table border-collapse" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
          <colgroup>
            <col className="col-no" style={{width:20,minWidth:20,maxWidth:20}} />
            <col className="col-nama" style={{width:180,minWidth:180,maxWidth:180}} />
            <col className="col-nik" style={{width:100,minWidth:100,maxWidth:100}} />
            <col className="col-bagian" style={{width:100,minWidth:100,maxWidth:100}} />
            {days.map((d) => <col key={`col-day-${d}`} className="col-tanggal" style={{width:30,minWidth:30,maxWidth:30}} />)}
            {['Hadir', 'Off', 'Sakit', 'Cuti', 'IDT', 'Tot.Pel', 'LAM', 'LAP', 'TSM', 'Mangkir', 'DT', 'Menit', 'AVG'].map((h) => <col key={`col-sum-${h}`} className="col-ringkasan" style={{width:30,minWidth:30,maxWidth:30}} />)}
          </colgroup>
          <thead>
            <tr>

function PelanggaranTab({ data, onSelectEmployee, onExplain }) {
  const rows = useMemo(() => {
    const out = [];
    data.employees.forEach((emp) => {
      for (let d = 1; d <= data.monthLength; d++) {
        const rec = emp.days[d];
        if (!rec || !PELANGGARAN_CODES.includes(rec.code) || rec.sudahDijelaskan) continue;
        const info = shiftInfoFor(rec.shift);
        out.push({
          ...rec,
          nik: emp.nik,
          nama: emp.nama,
          bagian: emp.bagian || '',
          day: d,
          masukSeharusnya: info?.masuk || '—',
          pulangSeharusnya: info?.pulang || '—',
          jenis: CODE_META[rec.code]?.label || rec.status || rec.code,
          keterangan:
            rec.code === 'M' ? 'Mangkir' :
            rec.code === 'LAM' ? 'Lupa Absen Masuk' :
            rec.code === 'LAP' ? 'Lupa Absen Pulang' :
            rec.code === 'TSM' ? 'Salah TSM' : (rec.status || rec.code),
        });
      }
    });
    out.sort((a, b) => a.day - b.day || a.nama.localeCompare(b.nama, 'id') || a.nik.localeCompare(b.nik));
    return out;
  }, [data]);

  const explainedRows = useMemo(() => {
    const out = [];
    data.employees.forEach((emp) => {
      for (let d = 1; d <= data.monthLength; d++) {
        const rec = emp.days[d];
        if (!rec || !PELANGGARAN_CODES.includes(rec.code) || !rec.sudahDijelaskan) continue;
        const info = shiftInfoFor(rec.shift);
        out.push({ ...rec, nik: emp.nik, nama: emp.nama, day: d, masukSeharusnya: info?.masuk || '—', pulangSeharusnya: info?.pulang || '—' });
      }
    });
    out.sort((a, b) => a.day - b.day || a.nama.localeCompare(b.nama, 'id') || a.nik.localeCompare(b.nik));
    return out;
  }, [data]);

  const tanggalLabel = (d) => {
    if (!data.year || !data.monthNum) return String(d);
    const dt = new Date(data.year, data.monthNum - 1, d);
    return `${String(d).padStart(2, '0')} ${MONTH_ID[Object.keys(MONTH_NUM).find((k) => MONTH_NUM[k] === data.monthNum)] || ''} ${data.year}`;
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <p className="text-xs text-slate-500">{rows.length} pelanggaran belum dijelaskan</p>
      </div>
      <div className="rounded-lg border border-slate-300 overflow-auto" style={{ maxHeight: '70vh' }}>
        <table className="w-full text-[13px] border-collapse pelanggaran-table" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
          <thead>
            <tr className="bg-blue-700 text-white">
              {[
                ['No','text-center'], ['NIK','text-center'], ['Nama','text-left'], ['Shift','text-center'],
                ['Masuk Seharusnya','text-center'], ['Pulang Seharusnya','text-center'], ['Masuk Aktual','text-center'], ['Pulang Aktual','text-center'],
                ['Tanggal','text-center'], ['Jenis','text-center'], ['Keterangan','text-left'], ['Penjelasan Karyawan','text-left'], ['Aksi','text-center']
              ].map(([h, align]) => (
                <th key={h} className={`sticky top-0 z-10 bg-blue-700 ${align} px-1.5 py-1 font-semibold whitespace-nowrap border border-blue-500`}>
                  {h.includes(' ') ? h.split(' ').map((w, i) => <React.Fragment key={i}>{i > 0 && <br />}{w}</React.Fragment>) : h}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((r, idx) => <ViolationRow key={`${r.nik}-${r.day}`} row={r} idx={idx} tanggalLabel={tanggalLabel} onSelectEmployee={onSelectEmployee} onExplain={onExplain} />)}
            {rows.length === 0 && <tr><td colSpan={13} className="text-center text-slate-400 py-8">Tidak ada pelanggaran yang belum dijelaskan.</td></tr>}
          </tbody>
        </table>
      </div>

      <div className="mb-2 mt-6 text-xs text-slate-500">{explainedRows.length} pelanggaran sudah dijelaskan</div>
      <div className="rounded-lg border border-slate-300 overflow-auto" style={{maxHeight:'70vh'}}>
        <table className="w-full text-[10px] border-collapse">
          <thead><tr style={{ backgroundColor: 'var(--idm-navy)' }} className="text-white">
            {['No','NIK','Nama','Shift','Masuk Seharusnya','Pulang Seharusnya','Masuk Aktual','Pulang Aktual','Tanggal','Jenis','Penjelasan Karyawan'].map((h,i)=><th key={h} style={{ backgroundColor: 'var(--idm-navy)', borderColor: '#0a5cc4' }} className={`sticky top-0 px-1.5 py-1 border font-semibold ${i===2||i===10?'text-left':'text-center'} whitespace-nowrap`}>{h}</th>)}
          </tr></thead>
          <tbody>
            {explainedRows.map((r,i)=><tr key={`${r.nik}-${r.day}`} className={i%2===0?'bg-white':'bg-slate-50'}>
              <td className="px-1.5 py-1 border border-slate-200 text-center">{i+1}</td><td className="px-1.5 py-1 border border-slate-200 text-center font-mono">{r.nik}</td>
              <td className="px-1.5 py-1 border border-slate-200 font-medium cursor-pointer" onClick={()=>onSelectEmployee(r.nik)}>{r.nama}</td><td className="px-1.5 py-1 border border-slate-200 text-center font-mono">{r.shift||'—'}</td>
              <td className="px-1.5 py-1 border border-slate-200 text-center font-mono">{r.masukSeharusnya}</td><td className="px-1.5 py-1 border border-slate-200 text-center font-mono">{r.pulangSeharusnya}</td>
              <td className="px-1.5 py-1 border border-slate-200 text-center font-mono">{r.masuk&&r.masuk!=='00:00'?r.masuk:'—'}</td><td className="px-1.5 py-1 border border-slate-200 text-center font-mono">{r.pulang&&r.pulang!=='00:00'?r.pulang:'—'}</td>
              <td className="px-1.5 py-1 border border-slate-200 text-center whitespace-nowrap">{String(r.day).padStart(2,'0')}</td><td className="px-1.5 py-1 border border-slate-200 text-center"><Badge code={r.code}/></td>
              <td className="px-1.5 py-1 border border-slate-200 text-slate-600">{r.penjelasan}</td>
            </tr>)}
            {explainedRows.length===0&&<tr><td colSpan={11} className="text-center text-slate-400 py-8">Belum ada pelanggaran yang dijelaskan.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

  return (
    <tr className={idx % 2 === 0 ? 'bg-white' : 'bg-slate-50'}>
      <td className="px-1.5 py-1 border border-slate-200 text-center text-slate-500">{idx + 1}</td>
      <td className="px-1.5 py-1 border border-slate-200 text-center text-slate-500 font-mono">{row.nik}</td>
      <td className="px-1.5 py-1 border border-slate-200 font-medium text-slate-800 cursor-pointer hover:underline whitespace-nowrap" onClick={() => onSelectEmployee(row.nik)}>{row.nama}</td>
      <td className="px-1.5 py-1 border border-slate-200 text-center text-slate-500 font-mono">{row.shift || '—'}</td>
      <td className="px-1.5 py-1 border border-slate-200 text-center text-slate-500 font-mono">{row.masukSeharusnya}</td>
      <td className="px-1.5 py-1 border border-slate-200 text-center text-slate-500 font-mono">{row.pulangSeharusnya}</td>
      <td className="px-1.5 py-1 border border-slate-200 text-center text-slate-500 font-mono">{row.masuk && row.masuk !== '00:00' ? row.masuk : '—'}</td>
      <td className="px-1.5 py-1 border border-slate-200 text-center text-slate-500 font-mono">{row.pulang && row.pulang !== '00:00' ? row.pulang : '—'}</td>
      <td className="px-1.5 py-1 border border-slate-200 text-center text-slate-500 whitespace-nowrap">{tanggalLabel(row.day)}</td>
      <td className="px-1.5 py-1 border border-slate-200 text-center"><Badge code={row.code} /></td>
      <td className="px-1.5 py-1 border border-slate-200 text-slate-600 whitespace-nowrap">{row.keterangan}</td>
      <td className="px-1.5 py-1 border border-slate-200 min-w-[220px]">
        <input value={text} onChange={(e) => setText(e.target.value)} placeholder="Isi penjelasan…" className="w-full text-[10px] px-1.5 py-1 rounded border border-slate-200 outline-none focus:ring-1 focus:ring-blue-300" />
      </td>
      <td className="px-1.5 py-1 border border-slate-200 text-center">
        <button disabled={!canSave} onClick={() => onExplain(row.nik, row.day, text.trim())} className="rounded px-2 py-1 text-[10px] font-semibold text-white disabled:opacity-40" style={{ backgroundColor:'#005baa' }}>Simpan</button>
      </td>
    </tr>
  );
}

}

// KONEKSI KE GOOGLE SHEETS (via Google Apps Script Web App)
// ----------------------------------------------------------------------------
// 1. Deploy Apps Script backend (lihat file AppsScript-Code.gs yang menyertai
//    aplikasi ini) sebagai Web App, lalu tempel URL-nya di bawah ini.
// 2. Isi APPS_SCRIPT_KEY sama persis dengan API_KEY yang kamu set di script itu.
// Kalau URL belum diisi, aplikasi otomatis fallback pakai localStorage browser
// (tersimpan lokal per-perangkat saja, tidak sinkron lintas device).
// ============================================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcBzDUt73lhjYUbOn0jyMy9JqsRIdWY6y5XyepaQpWqh-bDMQefvW4yl1Hhq4n5VIlQg/exec';
const APPS_SCRIPT_KEY = 'cB0NC0kuadrat'; // <-- isi sama dengan API_KEY di Apps Script

const sheetsApi = {
  configured() { return !!APPS_SCRIPT_URL; },
  async get(action, params) {
    const qs = new URLSearchParams({ action, ...(params || {}) }).toString();
    const res = await fetch(`${APPS_SCRIPT_URL}?${qs}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    return json;
  },
  async post(action, body) {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight Apps Script
      body: JSON.stringify({ action, apiKey: APPS_SCRIPT_KEY, ...(body || {}) }),
    });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    return json;
  },
};

function AnalisisTab({ periods, employeeDbMap }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');

  useEffect(() => {
    let alive = true;
    (async () => {
      setLoading(true); setErr('');
      try {
        const list = Array.isArray(periods) ? periods.slice().sort((a,b) => String(a.period).localeCompare(String(b.period))) : [];
        const results = await Promise.all(list.map(async (p) => {
          try {
            const res = await sheetsApi.get('getPeriod', { period: p.period });
            return { period: p.period, data: res.value ? JSON.parse(res.value) : null };
          } catch (e) { return { period: p.period, data: null }; }
        }));
        if (!alive) return;
        const out = results.filter(x => x.data).map(({period, data}) => {
          const emps = (data.employees || []).filter(e => !employeeDbMap || employeeDbMap[e.nik]);
          const totals = emps.reduce((a, e) => {
            a.pelanggaran += Number(e.pelanggaran || 0);
            a.hadir += Number(e.totals?.OK || 0);
            a.off += Number(e.totals?.OFF || 0);
            a.sakit += Number(e.totals?.S || 0);
            a.cuti += Number(e.totals?.C || 0);
            a.idt += Number(e.totals?.IDT || 0);
            return a;
          }, { pelanggaran:0, hadir:0, off:0, sakit:0, cuti:0, idt:0 });
          return { period, label: formatPeriodLabel(period), employees: emps.length, ...totals };
        });
        setRows(out);
      } catch (e) {
        if (alive) setErr('Data analisis belum dapat dimuat.');
      } finally { if (alive) setLoading(false); }
    })();
    return () => { alive = false; };
  }, [periods, employeeDbMap]);

  const maxRow = rows.reduce((best, r) => !best || r.pelanggaran > best.pelanggaran ? r : best, null);
  const totalViolation = rows.reduce((n,r) => n + r.pelanggaran, 0);
  const avgViolation = rows.length ? Math.round(totalViolation / rows.length) : 0;

  if (loading) return <div className="analysis-state">Memuat analisis bulanan...</div>;
  if (err) return <div className="analysis-state analysis-error">{err}</div>;
  if (!rows.length) return <div className="analysis-state">Belum ada data bulanan untuk dianalisis.</div>;

  return (
    <div className="analysis-page">
      <div className="analysis-intro">
        <div>
          <div className="analysis-title"><ChartIcon size={17}/> ANALISIS PRESENSI BULANAN</div>
          <div className="analysis-subtitle">Perbandingan data presensi dan pelanggaran dari seluruh periode yang tersedia.</div>
        </div>
        <div className="analysis-range">{formatPeriodLabel(rows[0].period)} — {formatPeriodLabel(rows[rows.length - 1].period)}</div>
      </div>

      <div className="analysis-kpis">
        <div className="analysis-kpi"><span>Total Pelanggaran</span><strong>{totalViolation}</strong></div>
        <div className="analysis-kpi"><span>Rata-rata / Bulan</span><strong>{avgViolation}</strong></div>
        <div className="analysis-kpi"><span>Bulan Tertinggi</span><strong>{maxRow?.label || '-'}</strong></div>
        <div className="analysis-kpi"><span>Periode Dianalisis</span><strong>{rows.length}</strong></div>
      </div>

      <div className="analysis-grid">
        <div className="analysis-card">
          <div className="analysis-card-head"><div><b>Tren Pelanggaran</b><small>Total pelanggaran per bulan</small></div></div>
          <div className="analysis-chart"><ResponsiveContainer width="100%" height="100%">
            <BarChart data={rows} margin={{ top: 8, right: 10, left: -12, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} />
              <XAxis dataKey="label" tick={{fontSize:10}} tickLine={false} axisLine={false} />
              <YAxis allowDecimals={false} tick={{fontSize:10}} tickLine={false} axisLine={false} />
              <Tooltip formatter={(v) => [v, 'Pelanggaran']} labelFormatter={(v) => v} />
              <Bar dataKey="pelanggaran" radius={[3,3,0,0]}>
                {rows.map((r,i) => <Cell key={i} fill={r.period === maxRow?.period ? '#e30613' : '#005baa'} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer></div>
        </div>

        <div className="analysis-card">
          <div className="analysis-card-head"><div><b>Status Presensi</b><small>Jumlah status per bulan</small></div></div>
          <div className="analysis-chart"><ResponsiveContainer width="100%" height="100%">
            <BarChart data={rows} margin={{ top: 8, right: 10, left: -12, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} />
              <XAxis dataKey="label" tick={{fontSize:10}} tickLine={false} axisLine={false} />
              <YAxis allowDecimals={false} tick={{fontSize:10}} tickLine={false} axisLine={false} />
              <Tooltip />
              <Bar dataKey="hadir" name="Hadir" stackId="a" fill="#005baa" />
              <Bar dataKey="off" name="Off" stackId="a" fill="#94a3b8" />
              <Bar dataKey="sakit" name="Sakit" stackId="a" fill="#f59e0b" />
              <Bar dataKey="cuti" name="Cuti" stackId="a" fill="#16a34a" />
              <Bar dataKey="idt" name="IDT" stackId="a" fill="#e30613" radius={[3,3,0,0]} />
            </BarChart>
          </ResponsiveContainer></div>
        </div>
      </div>
    </div>
  );
}

function PolaShiftTab() {
  const scrollRef = useRef(null);
  const [rows, setRows] = useState(() => Object.entries(normalizeShiftTable(SHIFT_TABLE)).sort(([a],[b]) => a.localeCompare(b, undefined, {numeric:true})));
  const [showForm, setShowForm] = useState(false);
  const [kode, setKode] = useState('');
  const [masuk, setMasuk] = useState('');
  const [pulang, setPulang] = useState('');
  const [jumat, setJumat] = useState(false);
  const [error, setError] = useState('');
  const [savingCloud, setSavingCloud] = useState(false);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
  }, []);

  useEffect(() => {
    if (!sheetsApi.configured()) return;
    (async () => {
      try {
        const res = await sheetsApi.get('getShiftDb');
        if (Array.isArray(res.shifts) && res.shifts.length > 0) {
          Object.keys(SHIFT_TABLE).forEach(k => delete SHIFT_TABLE[k]);
          res.shifts.forEach(row => {
            if (!row || !row.kode) return;
            SHIFT_TABLE[String(row.kode)] = {
              masuk: normalizeShiftTime(row.masuk),
              pulang: normalizeShiftTime(row.pulang),
              ...(row.jumat ? { jumat: true } : {})
            };
          });
          saveLocal();
          refresh();
        } else if (Array.isArray(res.shifts) && res.shifts.length === 0) {
          await sheetsApi.post('saveShiftDb', { shifts: Object.entries(SHIFT_TABLE).map(([kode, v]) => ({ kode, ...v })) });
        }
      } catch (err) {
        console.warn('Gagal sinkron pola shift:', err);
      }
    })();
  }, []);

  const refresh = () => {
    Object.assign(SHIFT_TABLE, normalizeShiftTable(SHIFT_TABLE));
    setRows(Object.entries(SHIFT_TABLE).sort(([a],[b]) => a.localeCompare(b, undefined, {numeric:true})));
    requestAnimationFrame(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; });
  };
  const saveLocal = () => localStorage.setItem('lhpk-shift-table', JSON.stringify(normalizeShiftTable(SHIFT_TABLE)));

  const submit = (e) => {
    e.preventDefault();
    const k = kode.trim();
    if (!k || !masuk || !pulang) { setError('Kode shift, jam masuk, dan jam pulang wajib diisi.'); return; }
    if (!/^\d{1,6}$/.test(k)) { setError('Kode shift hanya boleh berupa angka.'); return; }
    const validTime = (v) => /^([01]?\d|2[0-3]):[0-5]\d$/.test(v);
    if (!validTime(masuk) || !validTime(pulang)) { setError('Format jam harus HH:MM.'); return; }
    SHIFT_TABLE[k] = { masuk: normalizeShiftTime(masuk), pulang: normalizeShiftTime(pulang), ...(jumat ? { jumat: true } : {}) };
    saveLocal();
    refresh();
    setSavingCloud(true);
    sheetsApi.post('saveShiftDb', { shifts: Object.entries(SHIFT_TABLE).map(([kode, v]) => ({ kode, ...v })) })
      .catch(err => setError('Tersimpan di perangkat, tetapi gagal menyimpan ke database.'))
      .finally(() => setSavingCloud(false));
    setKode(''); setMasuk(''); setPulang(''); setJumat(false); setError(''); setShowForm(false);
  };

  const remove = (k) => {
    if (!window.confirm(`Hapus pola shift ${k}?`)) return;
    delete SHIFT_TABLE[k];
    saveLocal();
    refresh();
    setSavingCloud(true);
    sheetsApi.post('saveShiftDb', { shifts: Object.entries(SHIFT_TABLE).map(([kode, v]) => ({ kode, ...v })) })
      .catch(() => setError('Perubahan tersimpan di perangkat, tetapi gagal menyimpan ke database.'))
      .finally(() => setSavingCloud(false));
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <div>
          <p className="text-sm font-semibold text-slate-700">Data / Pola Shift</p>
          <p className="text-xs text-slate-500 mt-0.5">Atur kode shift beserta jam masuk dan pulangnya.</p>
        </div>
        <button
          onClick={() => { setShowForm((v) => !v); setError(''); }}
          className="inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-xs font-semibold text-white"
          style={{ backgroundColor:'#005baa' }}
        ><Plus size={14} /> Tambah Data</button>
      </div>

      {showForm && (
        <form onSubmit={submit} className="rounded-lg border border-slate-200 bg-white p-3 mb-4 shadow-sm">
          <p className="text-xs font-semibold text-slate-600 mb-2.5">Tambah Pola Shift Baru</p>
          <div className="flex flex-wrap items-end gap-2">
            <label className="text-[11px] text-slate-500">Kode Shift<input value={kode} onChange={e=>setKode(e.target.value.replace(/\D/g,''))} placeholder="Contoh: 325" className="block w-28 mt-1 text-xs px-2.5 py-1.5 rounded-md border border-slate-200 outline-none" /></label>
            <label className="text-[11px] text-slate-500">Masuk<input type="time" value={masuk} onChange={e=>setMasuk(normalizeShiftTime(e.target.value))} className="block w-28 mt-1 text-xs px-2 py-1.5 rounded-md border border-slate-200 outline-none" /></label>
            <label className="text-[11px] text-slate-500">Pulang<input type="time" value={pulang} onChange={e=>setPulang(normalizeShiftTime(e.target.value))} className="block w-28 mt-1 text-xs px-2 py-1.5 rounded-md border border-slate-200 outline-none" /></label>
            <label className="flex items-center gap-1.5 text-xs text-slate-600 pb-1.5"><input type="checkbox" checked={jumat} onChange={e=>setJumat(e.target.checked)} /> Khusus Jumat</label>
            <button type="submit" disabled={savingCloud} className="rounded-md px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-60" style={{backgroundColor:'#16a34a'}}>{savingCloud ? 'Menyimpan...' : 'Simpan'}</button>
          </div>
          {error && <p className="text-[11px] mt-2 text-rose-600">{error}</p>}
        </form>
      )}

      <div ref={scrollRef} className="pola-shift-scroll rounded-lg border border-slate-200 bg-white">
        <table className="pola-shift-table w-full text-[10px] border-collapse">
          <thead><tr className="bg-blue-700 text-white">
            <th className="px-2 py-1.5 text-center">No</th><th className="px-2 py-1.5 text-center">Kode Shift</th><th className="px-2 py-1.5 text-center">Masuk</th><th className="px-2 py-1.5 text-center">Pulang</th><th className="px-2 py-1.5 text-center">Keterangan</th><th className="px-2 py-1.5 text-center">Aksi</th>
          </tr></thead>
          <tbody>
            {rows.map(([k,v],i)=><tr key={k} className={i%2===0?'bg-white':'bg-slate-50'}>
              <td className="px-2 py-1 border-t border-slate-100 text-center text-slate-400">{i+1}</td>
              <td className="px-2 py-1 border-t border-slate-100 text-center font-semibold text-slate-700">{k}</td>
              <td className="px-2 py-1 border-t border-slate-100 text-center">{normalizeShiftTime(v.masuk)}</td>
              <td className="px-2 py-1 border-t border-slate-100 text-center">{normalizeShiftTime(v.pulang)}</td>
              <td className="px-2 py-1 border-t border-slate-100 text-center text-slate-500">{v.jumat ? 'Khusus Jumat' : 'Reguler'}</td>
              <td className="px-2 py-1 border-t border-slate-100 text-center"><button onClick={()=>remove(k)} className="inline-flex items-center justify-center rounded-md p-1 text-rose-500 hover:bg-rose-50" title="Hapus"><Trash2 size={13}/></button></td>
            </tr>)}
          </tbody>
        </table>

const localCache = {
  get(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } },
  set(key, value) { try { window.localStorage.setItem(key, value); } catch (e) { /* penuh/diblokir */ } },
};

// Hitung hari terakhir yang ada datanya di sebuah dataset hasil parseLhpkFile
function computeLastDataDay(parsedData) {
  let lastDay = 0;
  (parsedData.employees || []).forEach((emp) => {
    Object.keys(emp.days || {}).forEach((d) => { const n = Number(d); if (n > lastDay) lastDay = n; });
  });
  return lastDay;
}

function periodKeyOf(parsedData) {
  if (!parsedData.year || !parsedData.monthNum) return null;
  return `${parsedData.year}-${String(parsedData.monthNum).padStart(2, '0')}`;
}

// Normalisasi semua bentuk periode database menjadi satu kunci YYYY-MM.
// Ini mencegah periode yang sama muncul dua kali, misalnya:
// 2026-08 dan "Sat Aug 01 2026 00:00:00 GMT+0700 ...".
function normalizePeriodKey(value) {
  if (value === null || value === undefined || value === '') return null;
  const raw = String(value).trim();
  const ym = raw.match(/^(\d{4})[-\/](\d{1,2})(?:[-\/](\d{1,2}))?(?:[T\s].*)?$/);
  if (ym) {
    const m = Number(ym[2]);
    return m >= 1 && m <= 12 ? `${ym[1]}-${String(m).padStart(2, '0')}` : null;
  }
  const parsed = new Date(raw);
  if (!Number.isNaN(parsed.getTime())) {
    return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, '0')}`;
  }
  return raw;
}

// Rapikan daftar periode: satu bulan hanya boleh muncul satu kali.
function normalizePeriods(rows) {
  const seen = new Set();
  return (rows || []).reduce((out, r) => {
    const key = normalizePeriodKey(r?.period || r?.label);
    if (!key || seen.has(key)) return out;
    seen.add(key);
    out.push({ ...r, period: key, label: formatPeriodLabel(key) });
    return out;
  }, []).sort((a, b) => String(b.period).localeCompare(String(a.period)));
}

// Format periode agar tidak pernah menampilkan objek Date JavaScript seperti
// 'Sat Aug 01 2026 00:00:00 GMT+0700 (...)'.
function formatPeriodLabel(value) {
  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  if (value === null || value === undefined || value === '') return '';
  const raw = String(value).trim();

  // Prioritaskan format periode YYYY-MM dari database.
  const ym = raw.match(/^(\d{4})[-\/](\d{1,2})$/);
  if (ym) {
    const m = Number(ym[2]);
    return m >= 1 && m <= 12 ? `${monthNames[m - 1]} ${ym[1]}` : raw;
  }

  // Jika backend mengembalikan Date sebagai teks, ambil bulan dan tahun saja.
  const parsed = new Date(raw);
  if (!Number.isNaN(parsed.getTime())) {
    return `${monthNames[parsed.getMonth()]} ${parsed.getFullYear()}`;
  }

  return raw;
}




function App() {
  const [data, setData] = useState(null);
  const [employeeDb, setEmployeeDb] = useState(EMPLOYEE_DB_SEED);
  const [tab, setTab] = useState('rekap');
  const [selectedNik, setSelectedNik] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [initLoading, setInitLoading] = useState(true);
  const [syncError, setSyncError] = useState(null);
  const [uploadSuccess, setUploadSuccess] = useState(false);
  const [showAccessModal, setShowAccessModal] = useState(false);
  const [showSideMenu, setShowSideMenu] = useState(false);
  const [showAdminMenu, setShowAdminMenu] = useState(false);
  const [showExportMenu, setShowExportMenu] = useState(false);
  const [periods, setPeriods] = useState([]);
  const [loadingPeriod, setLoadingPeriod] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    // 1) Tampilkan dulu data dari cache lokal (instan, tanpa nunggu jaringan sama sekali).
    const cachedData = localCache.get('lhpk:dataset');
    const cachedEdb = localCache.get('lhpk:employee-db');
    if (cachedData) { try { setData(JSON.parse(cachedData)); } catch (e) {} }
    if (cachedEdb) { try { setEmployeeDb(JSON.parse(cachedEdb)); } catch (e) {} }
    setInitLoading(false); // app langsung bisa dipakai dengan data cache, tidak nunggu server

    if (!sheetsApi.configured()) {
      if (!cachedEdb) localCache.set('lhpk:employee-db', JSON.stringify(EMPLOYEE_DB_SEED));
      return;
    }

    // 2) Sinkron ke Google Sheets di belakang layar — tidak memblokir tampilan.
    (async () => {
      try {
        const [{ rows }, edbRes] = await Promise.all([
          sheetsApi.get('getIndex'),
          sheetsApi.get('getEmployeeDb'),
        ]);

        if (edbRes.employees && edbRes.employees.length > 0) {
          setEmployeeDb(edbRes.employees);
          localCache.set('lhpk:employee-db', JSON.stringify(edbRes.employees));
        } else if (!cachedEdb) {
          // EmployeeDB kosong di sheet (baru pertama kali dipakai) -> seed awal
          setEmployeeDb(EMPLOYEE_DB_SEED);
          sheetsApi.post('saveEmployeeDb', { employees: EMPLOYEE_DB_SEED }).catch(() => {});
        }

        if (rows && rows.length > 0) {
          const cleanRows = normalizePeriods(rows.filter(r => r && (r.period || r.label)));
          setPeriods(cleanRows);
          const latest = cleanRows[0];
          const periodRes = await sheetsApi.get('getPeriod', { period: latest.period });
          if (periodRes.value) {
            const parsed = JSON.parse(periodRes.value);
            setData(parsed);
            localCache.set('lhpk:dataset', periodRes.value);
          }
        }
      } catch (apiErr) {
        // Google Sheets gagal diakses (offline/URL salah) -> data cache yang sudah tampil tetap dipakai
        setSyncError('Gagal sinkron, menampilkan data cache lokal terakhir.');
      }
    })();
  }, []);

  const loadPeriod = useCallback(async (period) => {
    if (!period || loadingPeriod) return;
    if (!sheetsApi.configured()) {
      setError('Database belum terhubung.');
      return;
    }
    setLoadingPeriod(true);
    setError(null);
    try {
      const res = await sheetsApi.get('getPeriod', { period });
      if (!res.value) throw new Error('Data untuk periode tersebut tidak ditemukan.');
      const parsed = JSON.parse(res.value);
      setData(parsed);
      localCache.set('lhpk:dataset', res.value);
      setTab('rekap');
    } catch (e) {
      setError(e.message || 'Gagal memuat periode.');
    } finally {
      setLoadingPeriod(false);
    }
  }, [loadingPeriod]);

  const employeeDbMap = useMemo(
    () => Object.fromEntries(employeeDb.map((e) => [e.nik, e])),
    [employeeDb]
  );

  // Hanya karyawan yang terdaftar di database yang masuk ke rekap
  const filteredData = useMemo(() => {

          [r.pulangSeharusnya || '—', 'center'],
          [r.masuk && r.masuk !== '00:00' ? r.masuk : '—', 'center'],
          [r.pulang && r.pulang !== '00:00' ? r.pulang : '—', 'center'],
          [r.tanggalLabel, 'left'],
          [r.keterangan, 'left']
        ];
        cells.forEach(([val, align]) => {
          const td = document.createElement('td');
          td.style.cssText = `border:1px solid #cbd5e1;padding:0 8px;text-align:${align};vertical-align:middle;white-space:nowrap;background:#fff;height:32px;box-sizing:border-box;`;
          const span = document.createElement('span');
          span.textContent = val == null ? '' : String(val);
          span.style.cssText = 'display:flex;align-items:center;justify-content:' + (align === 'left' ? 'flex-start' : 'center') + ';height:32px;line-height:normal;box-sizing:border-box;';
          td.appendChild(span);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      document.body.appendChild(wrap);

      try {
        const canvas = await html2canvas(wrap, {
          scale: 2,
          backgroundColor: '#ffffff',
          width: wrap.scrollWidth,
          height: wrap.scrollHeight,
          windowWidth: Math.max(document.documentElement.clientWidth, wrap.scrollWidth),
          windowHeight: Math.max(document.documentElement.clientHeight, wrap.scrollHeight),
          scrollX: 0,
          scrollY: 0
        });
        const a = document.createElement('a');
        a.download = `pelanggaran-belum-dijelaskan-${(filteredData.monthLabelId || 'export').replace(/\s+/g, '-').toLowerCase()}.jpg`;
        a.href = canvas.toDataURL('image/jpeg', 0.95);
        document.body.appendChild(a);
        a.click();
        a.remove();
      } finally {
        document.body.removeChild(wrap);
      }
    } catch (e) {
      console.error('exportJpeg:', e);
      setSyncError('Gagal membuat file JPEG rincian pelanggaran.');
    } finally {
      setBusy(false);
      setShowExportMenu(false);
    }
  }, [filteredData]);

  const handleExport = useCallback((type) => {
    if (type === 'pdf') exportPdf();
    else if (type === 'excel') exportExcel();
    else if (type === 'jpeg') exportJpeg();
  }, [exportPdf, exportExcel, exportJpeg]);

  const persistEmployeeDb = useCallback((next) => {
    localCache.set('lhpk:employee-db', JSON.stringify(next));
    if (sheetsApi.configured()) {
      sheetsApi.post('saveEmployeeDb', { employees: next }).catch(() => {
        setSyncError('Gagal menyimpan database karyawan (sementara tersimpan lokal saja).');
      });
    }
  }, []);

  const handleAddEmployee = useCallback((emp) => {
    setEmployeeDb((prev) => {
      const next = [...prev, emp];
      persistEmployeeDb(next);
      return next;
    });
  }, [persistEmployeeDb]);

  const handleDeleteEmployee = useCallback((nik) => {
    setEmployeeDb((prev) => {
      const next = prev.filter((e) => e.nik !== nik);
      persistEmployeeDb(next);
      return next;
    });
  }, [persistEmployeeDb]);

  const saveDatasetToDatabase = useCallback(async (nextData) => {
    const period = periodKeyOf(nextData);
    if (!period || !sheetsApi.configured()) return;
    await sheetsApi.post('savePeriod', {
      period,
      label: nextData.monthLabelId || period,
      value: JSON.stringify(nextData),
      lastDataDay: computeLastDataDay(nextData),
    });
  }, []);

  const handleExplain = useCallback(async (nik, day, explanation) => {
    if (!data || !explanation) return;
    const next = {
      ...data,
      employees: data.employees.map((emp) => emp.nik !== nik ? emp : {
        ...emp,
        days: { ...emp.days, [day]: { ...emp.days[day], penjelasan: explanation, sudahDijelaskan: true } }
      })
    };
    setData(next);
    localCache.set('lhpk:dataset', JSON.stringify(next));
    try {
      await saveDatasetToDatabase(next);
    } catch (e) {
      setSyncError('Penjelasan tersimpan di aplikasi, tetapi gagal disimpan ke Google Sheets.');
    }
  }, [data, saveDatasetToDatabase]);

  const handleFile = useCallback(async (file) => {
    setBusy(true); setError(null); setSyncError(null);
    try {
      const parsed = await parseLhpkFile(file);
      const period = periodKeyOf(parsed);
      const newLastDay = computeLastDataDay(parsed);

      // Cek apakah periode (bulan) ini sudah ada datanya di Google Sheets,
      // dan apakah cakupan tanggal file baru lebih sedikit dari yang tersimpan.
      if (sheetsApi.configured() && period) {
        try {
          const existing = await sheetsApi.get('getPeriod', { period });
          if (existing.value) {
            const existingParsed = JSON.parse(existing.value);
            // Pertahankan penjelasan yang sudah diisi ketika file periode yang sama di-upload ulang.
            if (existingParsed.employees) {
              const oldMap = new Map(existingParsed.employees.map(e => [e.nik, e]));
              parsed.employees.forEach(emp => {
                const oldEmp = oldMap.get(emp.nik);
                if (!oldEmp) return;
                Object.keys(emp.days || {}).forEach(d => {
                  const oldRec = oldEmp.days?.[d];
                  if (oldRec?.sudahDijelaskan && oldRec?.penjelasan) {
                    emp.days[d] = { ...emp.days[d], penjelasan: oldRec.penjelasan, sudahDijelaskan: true };
                  }
                });
              });
            }
            const existingLastDay = computeLastDataDay(existingParsed);
            if (newLastDay < existingLastDay) {
              const proceed = window.confirm(
                `Data tersimpan untuk ${parsed.monthLabelId} sudah mencakup sampai tanggal ${existingLastDay}, ` +
                `sedangkan file ini hanya sampai tanggal ${newLastDay}.\n\n` +
                `Tetap timpa dengan data yang lebih sedikit ini?`
              );
              if (!proceed) { setBusy(false); return; }
            }
          }
        } catch (checkErr) {
          // gagal cek existing (mis. offline) -> tetap lanjut simpan, jangan blokir upload
        }
      }

      setData(parsed);
      setSelectedNik(null);
      localCache.set('lhpk:dataset', JSON.stringify(parsed));

      if (sheetsApi.configured() && period) {
        try {
          await sheetsApi.post('savePeriod', {
            period,
            label: parsed.monthLabelId || period,
            value: JSON.stringify(parsed),
            lastDataDay: newLastDay,
          });
          setUploadSuccess(true);
          window.setTimeout(() => setUploadSuccess(false), 3000);
        } catch (saveErr) {
          setSyncError('Data tampil tapi gagal tersimpan - cek koneksi/URL');
        }
      } else {
        setUploadSuccess(true);
        window.setTimeout(() => setUploadSuccess(false), 3000);
      }
    } catch (e) {
      setError(e.message || 'Gagal membaca file. Pastikan formatnya sesuai export LHPK.');
    } finally {
      setBusy(false);
    }
  }, []);

  if (initLoading) {
    return <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">Memuat…</div>;
  }

  return (
    <div className="idm-shell">
      <style>{FONT_IMPORT}</style>
      <div className="idm-brandbar">
        <button aria-label="Menu" className="idm-menu-btn" style={{ width: 'auto', height: 'auto' }}>
          <img src={LOGO_IMG} alt="Indomaret" style={{ width: 125, height: 'auto', objectFit: 'contain' }} />
        </button>
        <div className="idm-brand-title">
          <h1>{tab === 'rekap' ? 'REKAP PRESENSI' : (TAB_LABELS[tab] || 'REKAP PRESENSI')}</h1>
          <div className="idm-period-selector">
            {periods.length > 0 ? (
              <select
                value={data ? periodKeyOf(data) || '' : ''}
                onChange={(e) => loadPeriod(e.target.value)}
                disabled={loadingPeriod || busy}
                title="Pilih periode"
              >
                {periods.map((r) => (
                  <option key={r.period} value={r.period}>{formatPeriodLabel(r.period || r.label)}</option>
                ))}
              </select>
            ) : (
              <p>{data ? formatPeriodLabel(periodKeyOf(data) || data.monthLabelId || 'Periode tidak diketahui') : 'Rekap Presensi Karyawan'}</p>
            )}
            {loadingPeriod && <RefreshCw size={12} className="animate-spin" />}
          </div>
        </div>
        {uploadSuccess && (
          <div className="upload-success"><CheckCircle2 size={14} /> Upload berhasil</div>
        )}
        {(
          <div className="idm-top-actions">
            {tab === 'rekap' ? (
              <>
                <input ref={fileInputRef} type="file" accept=".xls,.xlsx" className="hidden"
                  onChange={(e) => { const f = e.target.files?.[0]; if (f) handleFile(f); e.target.value = ''; }} />
                <button onClick={() => fileInputRef.current?.click()} disabled={busy}
                  className="btn-upload-lhpk inline-flex items-center gap-2 rounded-md px-3 py-1.5 text-xs font-semibold text-white"
                  style={{ backgroundColor:'#e30613', color:'#fff' }}>
                  {busy ? <RefreshCw size={15} className="animate-spin" /> : <Upload size={15} />} UPLOAD<span className="idm-btn-sub"> LHPK</span>
                </button>
                {data && (
                  <>
                    <button onClick={() => window.location.reload()}
                      className="btn-refresh inline-flex items-center gap-2 rounded-md px-3 py-1.5 text-xs font-semibold text-white"
                      style={{ backgroundColor:'#005baa',color:'#fff' }}>
                      <RefreshCw size={15}/> REFRESH
                    </button>
                    <div className="relative">
                      <button
                        onClick={() => setShowExportMenu((v) => !v)}
                        disabled={busy}
                        className="btn-export inline-flex items-center gap-2 rounded-md px-3 py-1.5 text-xs font-semibold text-white"
                        style={{ backgroundColor:'#ffd100',color:'#fff' }}
                        title="Export rekap"
                      >
                        <Download size={15}/> EXPORT
                      </button>
                      {showExportMenu && (
                        <div className="absolute right-0 mt-1 z-50 rounded-md border border-slate-200 bg-white shadow-lg overflow-hidden" style={{ minWidth: 145 }}>
                          <button onClick={() => handleExport('pdf')} className="w-full text-left px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">PDF</button>
                          <button onClick={() => handleExport('excel')} className="w-full text-left px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">Excel</button>
                          <button onClick={() => handleExport('jpeg')} className="w-full text-left px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">JPEG</button>
                        </div>
                      )}
                    </div>
                    <button onClick={() => setShowAdminMenu(true)} title="Menu admin" aria-label="Menu admin"
                      className="inline-flex items-center justify-center">
                      <Settings size={26} color="#fff" />
                    </button>
                  </>
                )}
              </>
            ) : (
              <button onClick={() => setTab('rekap')} title="Kembali ke halaman utama" aria-label="Kembali ke halaman utama"
                className="inline-flex items-center justify-center">
                <Home size={26} color="#fff" />
              </button>
            )}
          </div>
        )}
      </div>

      <div className="idm-content">
        {false && data && (
          <div className="idm-period">
            <div><strong>{data.monthLabelId || 'Periode tidak diketahui'}</strong>{data.meta?.cabang ? `  ·  ${data.meta.cabang}` : ''}{data.meta?.divisi ? `  ·  ${data.meta.divisi}` : ''}</div>
            <div>{data.employees.length} karyawan</div>
          </div>
        )}

        {error && (
          <div className="mb-4 flex items-start gap-2 rounded-lg border px-3.5 py-2.5 text-sm" style={{ borderColor: '#fecdd3', backgroundColor: '#fff1f2', color: '#9f1239' }}>
            <FileWarning size={15} className="mt-0.5 shrink-0" />
            <span>{error}</span>
            <button onClick={() => setError(null)} className="ml-auto"><X size={14} /></button>
          </div>
        )}

        {syncError && (
          <div className="mb-4 flex items-center gap-2 rounded-lg border px-3 py-1.5 text-xs" style={{ borderColor: '#fde68a', backgroundColor: '#fffbeb', color: '#92400e' }}>
            <FileWarning size={13} className="shrink-0" />
            <span>{syncError}</span>
            <button onClick={() => setSyncError(null)} className="ml-auto"><X size={13} /></button>
          </div>
        )}

        {!data && tab !== 'karyawan' && tab !== 'pola-shift' && tab !== 'database' && tab !== 'analisis' && (
          <div className="flex flex-col items-center justify-center text-center py-16 text-slate-400">
            <FileWarning size={28} className="mb-3" />
            <p className="text-sm font-medium text-slate-500">Belum ada data presensi</p>
            <p className="text-xs mt-1">Klik tombol <strong>UPLOAD LHPK</strong> di kanan atas untuk memuat data.</p>
          </div>
        )}
        {tab === 'analisis' && (
          <AnalisisTab periods={periods} employeeDbMap={employeeDbMap} />
        )}
        {tab === 'rekap' && data && (
          <RekapTab data={filteredData} onSelectEmployee={(nik) => { setSelectedNik(nik); setTab('detail'); }} onSelectViolation={(nik) => { setSelectedNik(nik); setTab('pelanggaran'); }} />
        )}
        {tab === 'pelanggaran' && data && (
          <PelanggaranTab data={filteredData} onSelectEmployee={(nik) => { setSelectedNik(nik); setTab('detail'); }} onExplain={handleExplain} />
        )}
        {tab === 'detail' && data && (
          <DetailTab data={filteredData} selectedNik={selectedNik} onSelectEmployee={setSelectedNik} />
        )}
        {tab === 'karyawan' && (
          <KaryawanTab employeeDb={employeeDb} onAdd={handleAddEmployee} onDelete={handleDeleteEmployee} />
        )}
        {tab === 'pola-shift' && (
          <PolaShiftTab />
        )}
      </div>
      {showSideMenu && (
        <SideMenu tab={tab} onSelect={setTab} onClose={() => setShowSideMenu(false)} />
      )}
      {showAdminMenu && (
        <AdminMenu tab={tab} onSelect={setTab} onDatabase={() => setShowAccessModal(true)} onClose={() => setShowAdminMenu(false)} />
      )}
      {showAccessModal && (
        <AccessCodeModal
          onClose={() => setShowAccessModal(false)}
          onSuccess={() => { setShowAccessModal(false); openDatabaseSpreadsheetUrl(); }}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
